<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Queen 独立站预览</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #f7f4ef 0%, #e8e0d0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 60px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        .logo {
            font-family: 'Georgia', serif;
            font-size: 32px;
            letter-spacing: 0.2em;
            color: #0f0f14;
            margin-bottom: 8px;
        }
        .logo span { color: #b8935a; }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            background: #0f0f14;
            color: #f7f4ef;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
            margin: 8px;
        }
        .btn:hover {
            background: #b8935a;
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            color: #0f0f14;
            border: 2px solid #0f0f14;
        }
        .btn-outline:hover {
            background: #0f0f14;
            color: #f7f4ef;
        }
        .info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }
        .status {
            display: inline-block;
            padding: 6px 16px;
            background: #e8f5e9;
            color: #2e7d32;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">DANCING<span>·</span>QUEEN</div>
        <div class="subtitle">念珠手作 · 合香珠手串独立站</div>
        
        <div class="status">✓ 网站已就绪</div>
        
        <br>
        <a href="http://localhost:8080" class="btn" target="_blank">👉 打开网站预览</a>
        <br>
        <a href="index.html" class="btn btn-outline" target="_blank">查看完整网站</a>
        
        <div class="info">
            <p>💡 提示：双击此文件后，点击"打开网站预览"即可访问</p>
            <p>📱 转发给朋友时，请确保他们也能访问此文件</p>
        </div>
    </div>
</body>
</html>
