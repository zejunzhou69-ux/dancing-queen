<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Video Test</title>
</head>
<body>
    <h1>Video Test</h1>
    
    <h2>Test 1: Simple video tag</h2>
    <video controls width="640" src="images/incense/rose-a-video1.mp4"></video>
    
    <h2>Test 2: Video with source</h2>
    <video controls width="640">
        <source src="images/incense/rose-a-video1.mp4" type="video/mp4">
    </video>
    
    <h2>Test 3: Video with multiple sources</h2>
    <video controls width="640">
        <source src="images/incense/rose-a-video1.mp4" type="video/mp4">
        <source src="images/incense/rose-a-video1.webm" type="video/webm">
    </video>
    
    <p style="margin-top: 20px;">如果视频不显示，请右键点击视频选择"在新标签页中打开"查看是否能播放。</p>
</body>
</html>
